<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Club 8</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner brand">
    <div class="logo">E8</div>
    <div><h1>English Club 8</h1><p>Tablet-Aufgaben für 8a und 8b · Highlight 8</p></div>
  </div>
</header>
<main class="wrap">
  <div class="label">Diese Woche</div>
  <div id="now"></div>

  <h2>⭐ Schon fertig?</h2>
  <a class="row" href="bonus/">
    <span class="kw" style="font-size:1.5rem;min-width:40px">★</span>
    <span class="t"><b>Bonus</b><small>Videos, Quizze und Rätsel zum Weitermachen</small></span>
    <span class="go">→</span>
  </a>

  <h2>Frühere Wochen</h2>
  <div class="list" id="past"></div>

  <p class="foot">Kein Login · keine Werbung · es werden keine Daten verschickt.</p>
</main>
<script src="assets/weeks.js"></script>
<script>
(function () {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const visible = WEEKS.filter(w => new Date(w.start + "T00:00:00") <= today)
                       .sort((a, b) => a.start < b.start ? 1 : -1);
  const now = visible[0], past = visible.slice(1);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("now").innerHTML = now ? `
    <div class="card week-now" style="margin-top:8px">
      <span class="pill">Woche ab Montag, ${esc(now.monday)}</span>
      <h3>${esc(now.title)}</h3>
      <p>${esc(now.unit)} · ${esc(now.topic)}</p>
      <a class="btn" href="${now.id}/">Los geht's →</a>
    </div>` : `<div class="card">Bald geht's los!</div>`;
  document.getElementById("past").innerHTML = past.length ? past.map(w => `
    <a class="row" href="${w.id}/">
      <span class="kw">${esc(w.monday)}</span>
      <span class="t"><b>${esc(w.title)}</b><small>${esc(w.topic)}</small></span>
      <span class="go">→</span>
    </a>`).join("") : `<p class="label">Noch keine.</p>`;
})();
</script>
</body>
</html>
