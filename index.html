<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selbsttest Englisch 8</title>
<meta name="description" content="Testversion: Selbsttest who/which mit drei Aufgabentypen">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#f4f1e8; --card:#ffffff; --ink:#1b2a41; --muted:#5d6878; --line:#d9d3c3;
  --accent:#f7c531; --accent-ink:#1b2a41; --ok:#2e8b57; --ok-bg:#e3f4ea; --bad:#b5523b; --bad-bg:#fbe7e1;
  --chip:#eef1f6; --chip-ink:#1b2a41;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a27; --card:#1b2a41; --ink:#f3efe4; --muted:#a9b3c2; --line:#33445f;
  --accent:#f7c531; --accent-ink:#1b2a41; --ok:#5fd08f; --ok-bg:#163a2a; --bad:#ff8f75; --bad-bg:#3e1f19;
  --chip:#26385a; --chip-ink:#f3efe4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a27; --card:#1b2a41; --ink:#f3efe4; --muted:#a9b3c2; --line:#33445f;
  --accent:#f7c531; --accent-ink:#1b2a41; --ok:#5fd08f; --ok-bg:#163a2a; --bad:#ff8f75; --bad-bg:#3e1f19;
  --chip:#26385a; --chip-ink:#f3efe4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45;padding:0 16px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.badge{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;padding:6px 10px;font-size:15px;letter-spacing:.04em}
h1{font-size:1.35rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.level{font-size:.85rem;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.q{font-size:1.25rem;font-weight:700;margin:0 0 16px;text-wrap:balance}
.hint{color:var(--muted);font-size:.9rem;margin:-8px 0 14px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
button{font:inherit;cursor:pointer;border:none}
.opt{background:var(--chip);color:var(--chip-ink);border:2px solid var(--line);border-radius:14px;padding:14px 26px;font-weight:800;font-size:1.15rem;min-width:110px}
.opt.right{background:var(--ok-bg);border-color:var(--ok)} .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
input[type=text]{font:inherit;font-size:1.2rem;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.tiles,.line{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.line{border:2px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:14px}
.tile{background:var(--chip);color:var(--chip-ink);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.main{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:14px;padding:14px 24px;margin-top:16px;font-size:1.05rem}
.ghost{background:transparent;color:var(--muted);text-decoration:underline;margin-top:16px;margin-left:12px}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb small{display:block;font-weight:600;color:var(--ink);margin-top:4px}
.end{text-align:center}
.stars{font-size:2.6rem;letter-spacing:.2em;margin:8px 0}
.note{color:var(--muted);font-size:.8rem;margin-top:22px;text-align:center}
</style>

<div class="wrap">
  <header>
    <span class="badge">8a · 8b</span>
    <div><h1>Selbsttest: who or which?</h1><p class="sub">Unit 1 · Woche 42 · Testversion mit 3 Aufgaben</p></div>
  </header>
  <div class="progress"><span id="bar"></span></div>
  <div class="card" id="card"></div>
  <p class="note">Es wird nichts gespeichert und nichts verschickt.</p>
</div>

<script>
const TASKS = [
  { type: "choice", level: "★ Basis", q: "A mechanic is a person ___ repairs cars.", options: ["who", "which"], answer: "who",
    why: "A mechanic ist eine Person → who." },
  { type: "type", level: "★★ Aufbau", q: "I'm a thing which you use to change the TV channel. What am I?", hint: "Tippe das Wort von Vokabelblatt 4 ein.",
    answers: ["remote control", "a remote control", "the remote control"], why: "Lösung: a remote control (Fernbedienung)." },
  { type: "build", level: "★★ Aufbau", q: "Bau den Satz: Tippe die Wörter in der richtigen Reihenfolge an.",
    words: ["A", "coach", "is", "a", "person", "who", "trains", "a", "team."], why: "A coach is a person who trains a team." },
];

let i = 0, score = 0, firstTry = true;
const card = document.getElementById("card"), bar = document.getElementById("bar");
const norm = s => s.toLowerCase().replace(/[.!?]/g, "").replace(/\s+/g, " ").trim();
const shuffle = a => { const b = a.slice(); for (let k = b.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [b[k], b[j]] = [b[j], b[k]]; } return b; };

function feedback(ok, why) {
  const old = card.querySelector(".fb"); if (old) old.remove();
  const d = document.createElement("div");
  d.className = "fb " + (ok ? "ok" : "no");
  d.innerHTML = (ok ? "✓ Richtig!" : "✗ Noch nicht – versuch es nochmal.") + (ok ? `<small>${why}</small>` : "");
  card.appendChild(d);
  if (ok) {
    if (firstTry) score++;
    const n = document.createElement("button"); n.className = "main"; n.textContent = i < TASKS.length - 1 ? "Weiter →" : "Ergebnis anzeigen";
    n.onclick = () => { i++; render(); }; card.appendChild(n); n.focus();
  } else firstTry = false;
}

function render() {
  bar.style.width = (i / TASKS.length * 100) + "%";
  firstTry = true;
  if (i >= TASKS.length) return end();
  const t = TASKS[i];
  card.innerHTML = `<div class="level">${t.level} · Aufgabe ${i + 1} von ${TASKS.length}</div><p class="q">${t.q}</p>` + (t.hint ? `<p class="hint">${t.hint}</p>` : "");
  if (t.type === "choice") {
    const box = document.createElement("div"); box.className = "opts";
    shuffle(t.options).forEach(o => { const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
      b.onclick = () => { if (card.querySelector(".fb.ok")) return; const ok = o === t.answer; b.classList.add(ok ? "right" : "wrong"); feedback(ok, t.why); };
      box.appendChild(b); });
    card.appendChild(box);
  }
  if (t.type === "type") {
    const inp = document.createElement("input"); inp.type = "text"; inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false; inp.placeholder = "Deine Antwort …";
    const b = document.createElement("button"); b.className = "main"; b.textContent = "Prüfen";
    const check = () => { if (card.querySelector(".fb.ok")) return; feedback(t.answers.some(a => norm(a) === norm(inp.value)), t.why); };
    b.onclick = check; inp.onkeydown = e => { if (e.key === "Enter") check(); };
    card.append(inp, b);
  }
  if (t.type === "build") {
    const line = document.createElement("div"); line.className = "line";
    const pool = document.createElement("div"); pool.className = "tiles";
    shuffle(t.words.map((w, k) => ({ w, k }))).forEach(o => {
      const tile = document.createElement("button"); tile.className = "tile"; tile.textContent = o.w;
      tile.onclick = () => { if (card.querySelector(".fb.ok")) return; (tile.parentNode === pool ? line : pool).appendChild(tile); };
      pool.appendChild(tile);
    });
    const b = document.createElement("button"); b.className = "main"; b.textContent = "Prüfen";
    b.onclick = () => { if (card.querySelector(".fb.ok")) return; const built = [...line.children].map(x => x.textContent).join(" "); feedback(built === t.words.join(" "), t.why); };
    card.append(line, pool, b);
  }
}

function end() {
  bar.style.width = "100%";
  const stars = score === TASKS.length ? "★★★" : score >= TASKS.length - 1 ? "★★☆" : "★☆☆";
  card.innerHTML = `<div class="end"><div class="level">Geschafft!</div><div class="stars">${stars}</div>
    <p class="q">${score} von ${TASKS.length} beim ersten Versuch richtig</p>
    <button class="main" id="again">Nochmal üben</button></div>`;
  document.getElementById("again").onclick = () => { i = 0; score = 0; render(); };
}
render();
</script>
</html>
